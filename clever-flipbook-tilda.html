<!-- ============================================================
     CLEVER MAGAZINE — листающийся журнал для Tilda
     Вставить целиком в блок T123 «HTML-код».
     Менять нужно только раздел CONFIG в скрипте ниже.
     ============================================================ -->

<div class="cmf" id="cmf">
  <div class="cmf__stage">
    <button class="cmf__arrow cmf__arrow--prev cmf__arrow--side" type="button" aria-label="Предыдущая страница">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>

    <div class="cmf__bookwrap" id="cmf-wrap">
      <div class="cmf__loader">Загрузка…</div>
    </div>

    <button class="cmf__arrow cmf__arrow--next cmf__arrow--side" type="button" aria-label="Следующая страница">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
    </button>
  </div>

  <div class="cmf__bar">
    <button class="cmf__arrow cmf__arrow--prev cmf__arrow--mob" type="button" aria-label="Предыдущая страница">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <span class="cmf__counter" id="cmf-counter">&nbsp;</span>
    <button class="cmf__arrow cmf__arrow--next cmf__arrow--mob" type="button" aria-label="Следующая страница">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
    </button>
  </div>
</div>

<style>
  .cmf {
    --cmf-accent: #111;            /* цвет стрелок */
    --cmf-arrow-bg: #fff;          /* фон кнопок */
    --cmf-text: #111;              /* цвет счётчика */
    --cmf-page-bg: #f4f2ee;        /* фон страницы, пока грузится картинка */
    width: 100%;
    max-width: 1400px;
    margin: 0 auto;
    padding: 24px 16px;
    box-sizing: border-box;
  }
  .cmf *, .cmf *::before, .cmf *::after { box-sizing: border-box; }

  .cmf__stage {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 24px;
  }
  .cmf__bookwrap {
    position: relative;
    flex: 1 1 auto;
    min-width: 0;
    max-width: var(--cmf-maxw, 1200px);   /* считается из JS, чтобы журнал влезал по высоте экрана */
    min-height: 200px;
  }
  /* библиотека ставит min-width инлайном — на узких телефонах это ломает вёрстку */
  .cmf__book { width: 100% !important; min-width: 0 !important; min-height: 0 !important; }

  .cmf__page { background: var(--cmf-page-bg); overflow: hidden; }
  .cmf__page img {
    display: block;
    width: 100%; height: 100%;
    object-fit: cover;
    user-select: none; -webkit-user-drag: none;
    pointer-events: none;
    opacity: 0; transition: opacity .3s;
  }
  .cmf__page img.is-loaded { opacity: 1; }

  .cmf__loader {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font: 14px/1 inherit; letter-spacing: .04em; opacity: .5;
    color: var(--cmf-text);
    pointer-events: none;
  }
  .cmf.is-ready .cmf__loader { display: none; }

  .cmf__arrow {
    flex: 0 0 auto;
    width: 48px; height: 48px;
    border-radius: 50%;
    border: 1px solid rgba(0,0,0,.15);
    background: var(--cmf-arrow-bg);
    display: inline-flex; align-items: center; justify-content: center;
    cursor: pointer;
    padding: 0;
    transition: opacity .2s, transform .2s, border-color .2s;
    -webkit-tap-highlight-color: transparent;
  }
  .cmf__arrow svg {
    width: 22px; height: 22px;
    fill: none; stroke: var(--cmf-accent); stroke-width: 1.6;
    stroke-linecap: round; stroke-linejoin: round;
  }
  .cmf__arrow:hover:not(:disabled) { border-color: var(--cmf-accent); transform: scale(1.05); }
  .cmf__arrow:disabled { opacity: .25; cursor: default; }

  .cmf__bar {
    display: flex; align-items: center; justify-content: center;
    gap: 24px;
    margin-top: 18px;
  }
  .cmf__counter {
    min-width: 96px; text-align: center;
    font-size: 14px; letter-spacing: .06em;
    color: var(--cmf-text);
    font-variant-numeric: tabular-nums;
  }
  .cmf__arrow--mob { display: none; }

  /* Телефоны и узкие планшеты: стрелки переезжают под журнал */
  @media (max-width: 720px) {
    .cmf { padding: 16px 12px; }
    .cmf__arrow--side { display: none; }
    .cmf__arrow--mob { display: inline-flex; width: 44px; height: 44px; }
  }
</style>

<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
<script>
(function () {
  /* ============================ CONFIG ============================ */
  var CONFIG = {
    /* Папка с картинками (со слешем в конце). Файлы: page-001.webp … page-090.webp */
    baseUrl: 'https://cdn.jsdelivr.net/gh/kpospeeva-cmyk/clever-magazine@main/clever-autumn-2026/',
    pageCount: 90,
    fileName: function (n) { return 'page-' + String(n).padStart(3, '0') + '.webp'; },

    /* ИЛИ полный список ссылок по порядку (если картинки залиты в Тильду
       и у каждой своя ссылка). Если список не пустой — используется он. */
    pages: [],

    /* Пропорции страницы: A4 */
    pageWidth: 1240,
    pageHeight: 1754,

    /* Нумерация в счётчике — как в журнале. Файл page-003 = стр. 1
       (перед ней обложка и 2-я обложка), всего нумерованных страниц 86. */
    firstNumberedFile: 3,
    numberedPages: 86,

    /* Уже этой ширины — по одной странице, шире — развороты */
    singlePageBelow: 720,

    flipTime: 800      /* скорость перелистывания, мс */
  };
  /* ================================================================ */

  var root = document.getElementById('cmf');
  var wrap = document.getElementById('cmf-wrap');
  var counter = document.getElementById('cmf-counter');
  var prevBtns = root.querySelectorAll('.cmf__arrow--prev');
  var nextBtns = root.querySelectorAll('.cmf__arrow--next');
  var ratio = CONFIG.pageWidth / CONFIG.pageHeight;

  var urls = CONFIG.pages.length ? CONFIG.pages : (function () {
    var a = [];
    for (var n = 1; n <= CONFIG.pageCount; n++) a.push(CONFIG.baseUrl + CONFIG.fileName(n));
    return a;
  })();

  var flip = null, single = null, current = 0, pageEls = [];

  function isSingle() { return root.clientWidth <= CONFIG.singlePageBelow; }

  /* Ограничиваем ширину, чтобы журнал целиком помещался по высоте окна */
  function fitToViewport() {
    var reserve = isSingle() ? 120 : 110;
    var h = Math.max(window.innerHeight - reserve, 320);
    root.style.setProperty('--cmf-maxw', Math.round(h * ratio * (isSingle() ? 1 : 2)) + 'px');
  }

  /* Подгружаем только страницы рядом с текущей */
  function loadAround(i) {
    for (var k = Math.max(0, i - 3); k <= Math.min(pageEls.length - 1, i + 6); k++) {
      var img = pageEls[k].firstChild;
      if (!img.getAttribute('src')) img.setAttribute('src', img.getAttribute('data-src'));
    }
  }

  function updateUI(e) {
    if (!flip) return;
    /* во время события flip getCurrentPageIndex() иногда ещё старый — берём номер из события */
    var i = (e && typeof e.data === 'number') ? e.data : flip.getCurrentPageIndex();
    var total = flip.getPageCount();
    var portrait = flip.getOrientation() === 'portrait';
    current = i;

    /* какие файлы сейчас видны → печатные номера страниц */
    var visible = (portrait || i === 0 || i >= total - 1) ? [i] : [i, i + 1];
    var nums = visible.map(function (k) { return k - (CONFIG.firstNumberedFile - 1) + 1; })
      .filter(function (n) { return n >= 1 && n <= CONFIG.numberedPages; });
    /* на обложках счётчик пустой */
    counter.textContent = nums.length
      ? nums.join('–') + ' / ' + CONFIG.numberedPages
      : '\u00A0';

    var atEnd = portrait ? i >= total - 1 : (i === 0 ? total <= 1 : i + 2 >= total);
    prevBtns.forEach(function (b) { b.disabled = i === 0; });
    nextBtns.forEach(function (b) { b.disabled = atEnd; });
    loadAround(i);
  }

  function build() {
    if (typeof St === 'undefined') return;
    single = isSingle();
    fitToViewport();

    if (flip) { try { flip.destroy(); } catch (e) {} flip = null; }

    var book = document.createElement('div');
    book.className = 'cmf__book';
    wrap.appendChild(book);

    pageEls = urls.map(function (src, idx) {
      var p = document.createElement('div');
      p.className = 'cmf__page';
      if (idx === 0 || idx === urls.length - 1) p.setAttribute('data-density', 'hard'); /* обложки плотные */
      var img = document.createElement('img');
      img.alt = '';
      img.decoding = 'async';
      img.setAttribute('data-src', src);
      img.onload = function () { img.classList.add('is-loaded'); };
      p.appendChild(img);
      book.appendChild(p);
      return p;
    });
    loadAround(current);

    flip = new St.PageFlip(book, {
      width: CONFIG.pageWidth,
      height: CONFIG.pageHeight,
      size: 'stretch',
      /* режим (страница/разворот) решаем сами по ширине контейнера */
      minWidth: single ? 100000 : 1,
      maxWidth: single ? 100000 : 3000,
      minHeight: 1,
      maxHeight: 5000,
      autoSize: true,
      usePortrait: true,
      showCover: true,
      mobileScrollSupport: true,
      flippingTime: CONFIG.flipTime,
      maxShadowOpacity: 0.4,
      startPage: current
    });

    flip.on('init', function () { root.classList.add('is-ready'); updateUI(); });
    flip.on('flip', updateUI);
    flip.loadFromHTML(pageEls);
  }

  prevBtns.forEach(function (b) { b.addEventListener('click', function () { flip && flip.flipPrev(); }); });
  nextBtns.forEach(function (b) { b.addEventListener('click', function () { flip && flip.flipNext(); }); });

  document.addEventListener('keydown', function (e) {
    if (!flip) return;
    var r = root.getBoundingClientRect();
    if (r.bottom < 0 || r.top > window.innerHeight) return; /* журнал не на экране */
    if (e.key === 'ArrowRight') flip.flipNext();
    if (e.key === 'ArrowLeft') flip.flipPrev();
  });

  var t;
  window.addEventListener('resize', function () {
    clearTimeout(t);
    t = setTimeout(function () {
      if (!flip) return;
      fitToViewport();
      if (isSingle() !== single) build();   /* перевернули планшет и т.п. */
      else flip.update();
    }, 150);
  });

  function start() {
    if ('IntersectionObserver' in window) {
      var io = new IntersectionObserver(function (en) {
        if (en[0].isIntersecting) { io.disconnect(); build(); }
      }, { rootMargin: '600px 0px' });
      io.observe(root);
    } else build();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
  else start();
})();
</script>
